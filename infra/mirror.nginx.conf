# Managed by prapor infra/deploy.ps1.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    # The deployment verifies this exact private Traefik address.
    set_real_ip_from 10.0.1.7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 2m;
    client_body_timeout 30s;
    send_timeout 60s;
    server {
        listen 8080 default_server;
        server_name _;
        location = /healthz { return 200 'ok\n'; }
        location / { return 421; }
    }
    server {
        listen 8080;
        server_name game.balkhaev.com;
        location / {
            proxy_pass https://81.90.31.214;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name game.delopusk.ru;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 4;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host game.delopusk.ru;
            proxy_set_header X-Forwarded-Host game.balkhaev.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            # Both exact public origins are accepted by the application.
            proxy_set_header Origin $http_origin;
            proxy_set_header Referer $http_referer;
            proxy_set_header Connection '';
            proxy_hide_header Alt-Svc;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_next_upstream off;
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect https://game.delopusk.ru/ https://game.balkhaev.com/;
            # Host-only cookies pass unchanged; there is no second account DB.
        }
    }
}
