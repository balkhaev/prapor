# Git-based production deployment managed by Coolify.
name: prapor-coolify
services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    image: prapor-game:${SOURCE_COMMIT:-main}
    pull_policy: never
    container_name: prapor-game
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      ACCOUNT_DB_PATH: /app/data/accounts.sqlite
      GAME_DB_PATH: /app/data/game.sqlite
      LIVE_DB_PATH: /app/data/live.sqlite
      APP_ORIGINS: https://game.delopusk.ru,https://game.balkhaev.com
      TRUSTED_PROXIES: 172.18.0.2
      AUTH_HASH_CONCURRENCY: "2"
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      RESEND_FROM: "ggpick <noreply@ggpick.club>"
      PUBLIC_BASE_URL: https://game.balkhaev.com
      GOOGLE_CLIENT_ID: 764541788875-0bj0prqnptqop4u5b2v5qgf2i4ut7t26.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      GOOGLE_REDIRECT_URIS: https://game.delopusk.ru/callback/auth/google,https://game.balkhaev.com/callback/auth/google
      RELEASE_COMMIT: ${SOURCE_COMMIT:-unknown}
    volumes:
      - type: bind
        source: /data/prapor/data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: /data/prapor/secrets/resend_api_key
        target: /run/secrets/resend_api_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /data/prapor/secrets/google_client_secret
        target: /run/secrets/google_client_secret
        read_only: true
        bind:
          create_host_path: false
    expose: ["3000"]
    networks: [coolify]
    healthcheck:
      test: [CMD, bun, -e, "const response = await fetch('http://127.0.0.1:3000/health'); process.exit(response.ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      - prapor.managed=true
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.prapor-game.loadbalancer.server.port=3000
      - traefik.http.routers.prapor-game-https.rule=Host(`game.delopusk.ru`) || Host(`game.balkhaev.com`)
      - traefik.http.routers.prapor-game-https.entrypoints=https
      - traefik.http.routers.prapor-game-https.service=prapor-game
      - traefik.http.routers.prapor-game-https.tls.certresolver=letsencrypt
      - traefik.http.routers.prapor-game-https.tls.domains[0].main=game.delopusk.ru
      - traefik.http.routers.prapor-game-http.rule=Host(`game.delopusk.ru`)
      - traefik.http.routers.prapor-game-http.entrypoints=http
      - traefik.http.routers.prapor-game-http.service=prapor-game
      - traefik.http.routers.prapor-game-http.middlewares=prapor-game-https
      - traefik.http.middlewares.prapor-game-https.redirectscheme.scheme=https
      - traefik.http.middlewares.prapor-game-https.redirectscheme.permanent=true
networks:
  coolify:
    external: true
